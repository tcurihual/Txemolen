[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.7" }
listenfd = "1.0.1"
tokio = { version = "1.0", features = ["full"] }
sea-orm = { version = "0.12", features = [
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
    "chrono",
]}
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio",
    "macros"
] }
dotenvy = "0.15"
chrono = "0.4"